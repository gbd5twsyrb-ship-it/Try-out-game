<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Button Game</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #333;
            margin-top: 0;
        }

        .instructions {
            color: #666;
            line-height: 1.6;
        }

        .score-board {
            display: flex;
            justify-content: space-around;
            background: #f1f3f9;
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .score-board p {
            margin: 5px;
            font-weight: bold;
            color: #555;
        }

        .score-board span {
            color: #764ba2;
            font-size: 24px;
        }

        #start-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #start-button:hover {
            background: #5365c9;
        }

        #game-area {
            width: 100%;
            height: 300px;
            background: #f7f7fb;
            border: 3px dashed #ccc;
            border-radius: 12px;
            position: relative;
            overflow: hidden;
        }

        #target {
            width: 50px;
            height: 50px;
            background: #ff4757;
            border: none;
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            display: none;
            transition: background 0.2s;
        }

        #target:hover {
            background: #ff6b81;
        }

        #message {
            color: #555;
            font-weight: bold;
            margin-top: 15px;
            min-height: 24px;
        }
    </style>
</head>

<body>

    <div class="game-container">

        <h1>🎯 Catch the Button!</h1>

        <p class="instructions">
            Click the red target as many times as you can
            before the timer reaches zero.
        </p>

        <div class="score-board">
            <p>Score: <span id="score">0</span></p>
            <p>Time: <span id="time">30</span>s</p>
        </div>

        <button id="start-button">Start Game</button>

        <div id="game-area">
            <button id="target" aria-label="Catch the target"></button>
        </div>

        <p id="message">Press Start Game to begin!</p>

    </div>

    <script>
        // 1. Get the HTML elements
        const scoreDisplay = document.getElementById("score");
        const timeDisplay = document.getElementById("time");
        const startButton = document.getElementById("start-button");
        const gameArea = document.getElementById("game-area");
        const target = document.getElementById("target");
        const message = document.getElementById("message");

        // 2. Create game variables
        let score = 0;
        let timeLeft = 60;
        let gameRunning = false;
        let timer;

        // 3. Move the target to a random position
        function moveTarget() {
            const maxX = gameArea.clientWidth - target.offsetWidth;
            const maxY = gameArea.clientHeight - target.offsetHeight;

            const randomX = Math.floor(Math.random() * (maxX + 1));
            const randomY = Math.floor(Math.random() * (maxY + 1));

            target.style.left = randomX + "px";
            target.style.top = randomY + "px";
        }

        // 4. Start the game
        function startGame() {
            score = 0;
            timeLeft = 30;
            gameRunning = true;

            scoreDisplay.textContent = score;
            timeDisplay.textContent = timeLeft;
            message.textContent = "Game on! Catch the target!";
            startButton.disabled = true;
            startButton.textContent = "Game Running...";

            target.style.display = "block";
            moveTarget();

            timer = setInterval(function () {
                timeLeft--;
                timeDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        // 5. Increase the score when the target is clicked
        target.addEventListener("click", function () {
            if (gameRunning) {
                score++;
                scoreDisplay.textContent = score;
                moveTarget();
            }
        });

        // 6. End the game
        function endGame() {
            gameRunning = false;
            clearInterval(timer);

            target.style.display = "none";
            startButton.disabled = false;
            startButton.textContent = "Play Again";

            message.textContent = "Time's up! Your final score is " + score + "!";
        }

        // 7. Listen for the Start Game button
        startButton.addEventListener("click", startGame);

    </script>

</body>

</html>
